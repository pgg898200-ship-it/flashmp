[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flashmp"
version = "0.1.0"
description = "Find repeated shapes and unusual windows in numeric time series with exact CPU matrix profiles, bounded-window streaming, and cross-series search."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
keywords = [
    "time-series",
    "matrix-profile",
    "stumpy",
    "streaming",
    "anomaly-detection",
    "motif-discovery",
    "changepoint-detection",
    "data-leakage",
    "mcp",
    "ai-agents",
    "simd",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
numpy = ["numpy>=1.23"]
dev = ["numpy>=1.23", "pytest>=8.0"]

[project.scripts]
flashmp = "flashmp.cli:main"
flashmp-mcp = "flashmp.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flashmp = [
    "_csrc/flashmp.hpp",
    "_csrc/flashmp.cpp",
    "_csrc/libflashmp.so",
    "_csrc/libflashmp.dylib",
    "_csrc/flashmp.dll",
]
