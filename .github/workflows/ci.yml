name: FlashMP CI (Release + ASan/UBSan + Tests)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build C++20 release library
        run: |
          g++ -O3 -march=x86-64-v3 -std=c++20 -fno-math-errno -funroll-loops -pthread -fPIC -shared -Wall -Wextra -Werror \
            src/flashmp/_csrc/flashmp.cpp -o src/flashmp/_csrc/libflashmp.so

      - name: Test zero-dependency pure-stdlib mode (no NumPy)
        run: |
          PYTHONPATH=src python3 -c "import time; t0=time.perf_counter(); import flashmp; dt=(time.perf_counter()-t0)*1e3; print(f'cold import: {dt:.2f} ms'); assert dt < 25.0"
          PYTHONPATH=src python3 -m flashmp.cli demo

      - name: Install optional NumPy + pytest and run full verification suite
        run: |
          python3 -m pip install numpy pytest
          PYTHONPATH=src pytest tests/ -v
