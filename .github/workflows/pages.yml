name: Deploy FlashMP GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "llms.txt"
      - "SKILL.md"
      - "benchmarks/RESULTS.md"
      - "benchmarks/results_*.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Assemble Static Site & AI Agent Endpoints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Assemble published site root (_site/)
        run: |
          rm -rf _site
          mkdir -p _site/benchmarks
          cp -r docs/* _site/
          cp llms.txt _site/llms.txt
          cp SKILL.md _site/SKILL.md
          cp benchmarks/RESULTS.md _site/RESULTS.md
          cp benchmarks/RESULTS.md _site/benchmarks/RESULTS.md
          cp benchmarks/results_*.json _site/benchmarks/
          touch _site/.nojekyll
          ls -la _site/ _site/benchmarks/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
